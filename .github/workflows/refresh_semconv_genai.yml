name: Refresh GenAI semantic-convention data

# This job refreshes payload schemas and provider names monthly.
# It opens a pull request when either source changes.
# GitHub-token pull requests do not start workflows.
# Therefore, this job runs the gate before opening the pull request.

on:
  schedule:
    # 07:00 UTC on the 1st of each month.
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BRANCH: semconv-genai-refresh
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # The script stores every run parameter as a constant.
      - name: Refresh vendored data
        run: uv run python -m scripts.refresh_semconv_genai

      # JSON diffs detect payload-schema or provider-name changes.
      - name: Detect vendored data changes
        id: drift
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- 'tests/semconv_genai/*.json')" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "The vendored data matches upstream; nothing to do."
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- tests/semconv_genai
          fi

      # The gate validates payloads and built-in provider names.
      # continue-on-error keeps the pull-request step reachable.
      # The final step restores a failed gate status.
      - name: Run the gate against refreshed data
        if: steps.drift.outputs.moved == 'true'
        id: gate
        continue-on-error: true
        run: bash scripts/CI.sh

      - name: Open or update the pull request
        if: steps.drift.outputs.moved == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.gate.outcome }}" = "success" ]; then
            verdict="The gate passes. Every tested payload validates. Every built-in provider name remains registered. Catch-all schema variants still admit unrecognized element types."
          else
            verdict="The gate fails. The run log identifies the rejected assertion."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add tests/semconv_genai
          git commit -m "Refresh vendored GenAI semantic-convention data"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Refresh vendored GenAI semantic-convention data" \
              --body "$verdict"$'\n\n'"Opened by the refresh workflow. \`tests/semconv_genai/SOURCE.md\` records the source paths."
          else
            gh pr comment "$BRANCH" --body "Refreshed again. $verdict"
          fi

      # This step applies the gate result to the job.
      - name: Report the gate's verdict
        if: steps.drift.outputs.moved == 'true' && steps.gate.outcome != 'success'
        run: |
          echo "The refreshed data fails the gate. See the pull request." >&2
          exit 1

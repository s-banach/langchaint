templates:
  - template: json.j2
    filter: >-
      def normalized_attribute: {
        name: .key,
        value_type: (
          if (.type | type) == "object" then "string"
          elif .type == "template[string]" then "string"
          else .type
          end
        ),
        allowed_values: (
          if (.type | type) == "object" then [.type.members[].value]
          else null
          end
        ),
        presence_rule: .requirement_level,
        structured_schema: (.annotations.type.json_schema // null),
        template_prefix: (
          if .type == "template[string]" then (.key + ".")
          else null
          end
        )
      };
      def span_attributes($type):
        [.registry.spans[] | select(.type == $type)]
        | if length == 1 then .[0].attributes
          else error("the resolved registry has \(length) spans of type \($type), expected 1")
          end;
      span_attributes("gen_ai.client.inference") as $base_attributes
      | {
        attributes: [
          $base_attributes[]
          | normalized_attribute
        ],
        refinements: [
          .refinements.spans[]
          | select(
              .type == "gen_ai.client.inference"
              and .id != "gen_ai.client.inference"
            )
          | {
              id: .id,
              attributes: [
                .attributes[]
                  | select(
                      . as $refinement_attribute
                      | (
                          $base_attributes
                          | map(select(.key == $refinement_attribute.key))
                          | first
                        ) as $base_attribute
                      | $base_attribute == null
                        or ($refinement_attribute | normalized_attribute)
                          != ($base_attribute | normalized_attribute)
                    )
                  | normalized_attribute
              ]
            }
        ]
      }
    application_mode: single
    file_name: chat-span-attributes.json
  - template: json.j2
    filter: >-
      def span_attributes($type):
        [.registry.spans[] | select(.type == $type)]
        | if length == 1 then .[0].attributes
          else error("the resolved registry has \(length) spans of type \($type), expected 1")
          end;
      [span_attributes("gen_ai.execute_tool.internal")[].key]
      | sort
    application_mode: single
    file_name: execute-tool-span-attribute-names.json
  - template: json.j2
    filter: >-
      .registry.attributes
      | map(
          select(.annotations.type.json_schema != null)
          | .key
        )
    application_mode: single
    file_name: _semconv_genai_structured_attributes.json

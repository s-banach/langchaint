[project]
name = "langchaint"
version = "0.29.0"
description = "It ain't langchain."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Hopfensperger" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.25",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0.0"]
anthropic-bedrock = ["anthropic[bedrock]>=1.0.0"]
cohere-bedrock = ["boto3>=1.42", "numpy>=2.5.0"]
deepseek = ["openai>=3.0.0"]
gemini = ["google-genai>=2.18.0"]
openai = ["openai>=3.0.0"]
openai-embedding = ["numpy>=2.5.0", "openai>=3.0.0", "tiktoken>=0.13.0"]
openai-bedrock = ["openai[bedrock]>=3.0.0"]
tracing = ["opentelemetry-api>=1.30.0"]

[project.urls]
Repository = "https://github.com/s-banach/langchaint"

[build-system]
requires = ["uv_build>=0.11.26,<1.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=1.0.0",
    "coverage>=7.10.0",
    "numpy>=2.5.0",
    "openai>=3.0.0",
    "opentelemetry-api>=1.30.0",
    # The in-memory tracing exporter requires the SDK only in tests.
    "opentelemetry-sdk>=1.30.0",
    "pytest>=9.0.2",
    "pyrefly>=1.3.0",
    "ruff>=0.16.0",
    # jsonschema ships no stubs, so its callers in tools.py go unchecked without these.
    "types-jsonschema>=4.26.0.20260518",
    "typos>=1.48.0",
    "google-genai>=2.18.0",
    "boto3>=1.42",
    "boto3-stubs[bedrock-runtime]>=1.42",
    "tiktoken>=0.13.0",
]

[tool.pyrefly]
preset = "all"
project-includes = ["src", "tests", "examples", "scripts"]
# Tests import across modules; the example app uses bare imports.
search-path = ["src", ".", "examples/full_app"]

[tool.pyrefly.errors]
implicit-bool = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples/full_app"]
filterwarnings = [
    "error",
    # google-genai emits this warning during import on Python 3.14 and newer.
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3\\.17$:DeprecationWarning:google\\.genai\\.types",
]

[tool.coverage.run]
branch = true
omit = ["tests/test_full_app.py"]
relative_files = true
source = ["src/langchaint", "examples/full_app"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.ruff]
line-length = 99
format.preview = true

lint.preview = true
lint.explicit-preview-rules = true
lint.select = [
    # Contexts held across async yields can time or trace consumer work.
    "yield-in-context-manager-in-async-generator",
    "ANN",
    "BLE",
    "FBT",
    "PERF",
    "A",
    "B",
    "INP",
    "PIE",
    "PT",
    "RET",
    "RSE",
    "SIM",
    "SLOT",
    "TID",
    "TC",
    "ARG",
    "LOG",
    "G",
    "PTH",
    "FLY",
    "I",
    "N",
    "F",
    "PL",
    "too-many-positional-arguments",
    "UP",
    "FURB",
    "RUF",
    "TRY",
    "doc-line-too-long",  # capped by pycodestyle.max-doc-length below
    # Select compatible rules for imperative summaries and Args:/Raises:/Yields: sections.
    "undocumented-public-module",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "undocumented-public-package",
    "undocumented-magic-method",
    "undocumented-public-nested-class",
    "undocumented-public-init",
    "unnecessary-multiline-docstring",
    "blank-line-before-function",
    "blank-line-after-function",
    "incorrect-blank-line-after-class",
    "missing-blank-line-after-summary",
    "docstring-tab-indentation",
    "under-indentation",
    "over-indentation",
    "new-line-after-last-paragraph",
    "surrounding-whitespace",
    "blank-line-before-class",
    "multi-line-summary-first-line",
    "overindented-section",
    "overindented-section-underline",
    "triple-single-quotes",
    "escape-sequence-in-docstring",
    "missing-trailing-period",
    "non-imperative-mood",
    "signature-in-docstring",
    "docstring-starts-with-this",
    "missing-terminal-punctuation",
    "undocumented-param",
    "overload-with-docstring",
    "empty-docstring",
    # Preview docstring features
    "docstring-extraneous-returns",
    "docstring-missing-yields",
    "docstring-extraneous-yields",
    # DOC501/DOC502 misread exceptions raised through class factories; review Raises: manually.
]
lint.ignore = [
    "any-type",
    "suppressible-exception",
    "magic-value-comparison",
    "raise-vanilla-args",
    "too-many-arguments",
    # The `bind` signatures write `X | None | Unchanged` to keep the sentinel
    # adjacent to its `= UNCHANGED` default; obeying the rule would bury it.
    "none-not-at-end-of-union",
]

lint.pycodestyle.max-doc-length = 120
lint.flake8-tidy-imports.ban-relative-imports = "all"

# Retry loops need one branch per ResponseOutcome variant.
lint.pylint.max-returns = 10
lint.pylint.max-branches = 18
lint.pylint.max-statements = 60

lint.per-file-ignores."examples/*" = ["implicit-namespace-package"]
lint.per-file-ignores."examples/full_app/*" = ["implicit-namespace-package", "blind-except", "too-many-return-statements"]
lint.per-file-ignores."tests/*" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.typos.default.extend-words]

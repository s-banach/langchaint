name: Refresh GenAI semantic-convention data

# This job refreshes the resolved chat span declaration and structured schemas weekly.
# It opens a pull request when the committed semantic-convention data changes.
# GitHub-token pull requests do not start workflows.
# Therefore, this job runs the gate before opening the pull request.

on:
  schedule:
    # 07:00 UTC each Monday.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BRANCH: semconv-genai-refresh
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out GenAI semantic conventions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-telemetry/semantic-conventions-genai
          ref: main
          path: build/semantic-conventions-genai-source

      - name: Prepare the source commit and read the Weaver version
        id: source
        working-directory: build/semantic-conventions-genai-source
        run: |
          git update-ref refs/langchaint/prepared HEAD
          echo "weaver_version=$(sed -n 's/^WEAVER_VERSION=//p' versions.env)" >> "$GITHUB_OUTPUT"

      - name: Install Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@26c685ff52b925056ff1d53476c6022638c01220 # v0.25.1
        with:
          version: ${{ steps.source.outputs.weaver_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Refresh vendored data
        run: uv run python -m scripts.refresh_semconv_genai

      - name: Detect vendored data changes
        id: drift
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- tests/semconv_genai)" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "The vendored data matches upstream; nothing to do."
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- tests/semconv_genai
          fi

      - name: Run the gate against refreshed data
        if: steps.drift.outputs.moved == 'true'
        id: gate
        continue-on-error: true
        run: bash scripts/CI.sh

      - name: Open or update the pull request
        if: steps.drift.outputs.moved == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.gate.outcome }}" = "success" ]; then
            verdict="The gate passes against the refreshed chat span declaration and structured schemas."
          else
            verdict="The gate fails. The run log identifies the rejected assertion."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add tests/semconv_genai
          git commit -m "Refresh vendored GenAI semantic-convention data"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Refresh vendored GenAI semantic-convention data" \
              --body "$verdict"$'\n\n'"Opened by the refresh workflow. \`tests/semconv_genai/SOURCE.md\` records the source paths."
          else
            gh pr comment "$BRANCH" --body "Refreshed again. $verdict"
          fi

      - name: Report the gate's verdict
        if: steps.drift.outputs.moved == 'true' && steps.gate.outcome != 'success'
        run: |
          echo "The refreshed data fails the gate. See the pull request." >&2
          exit 1

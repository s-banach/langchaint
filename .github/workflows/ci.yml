name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bump the Python entries when a new release becomes supported.
        include:
          # Newest resolvable dependencies on the oldest and newest supported Python versions.
          - { python-version: "3.13", resolution: highest }
          - { python-version: "3.15", resolution: highest }
          # Minimum direct dependency versions on the oldest supported Python version.
          - { python-version: "3.13", resolution: lowest-direct }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # uv.lock is gitignored, so key the cache on the committed dependency source instead of the default uv.lock/requirements glob, which matches nothing here.
          cache-dependency-glob: "pyproject.toml"
          # UV_RESOLUTION is not part of setup-uv's cache key, so without a suffix the two 3.13 jobs (highest and lowest-direct) share one key and race to save it; keying the suffix on the resolution gives each its own cache.
          cache-suffix: ${{ matrix.resolution }}
      # scripts/CI.sh runs pyrefly, ruff, and pytest through `uv run`, which syncs the locked dev dependency group first.
      # Each job resolves dependencies using `UV_RESOLUTION` because `uv.lock` is ignored.
      # Every job runs the checks defined in `scripts/CI.sh`.
      - run: bash scripts/CI.sh
        env:
          UV_RESOLUTION: ${{ matrix.resolution }}

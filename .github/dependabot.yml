version: 2
updates:
  # Update GitHub Actions only.
  # Runtime and development dependency declarations specify minimum versions without upper bounds.
  # CI tests minimum direct versions and newest resolvable versions.
  # Raising minimum versions would narrow the supported range.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Group all GitHub Actions updates into one pull request.
    groups:
      actions:
        patterns:
          - "*"

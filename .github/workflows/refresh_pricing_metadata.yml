name: Refresh pricing metadata

# The refresh never commits.
# It opens one issue when LiteLLM rates differ from the committed generated pricing modules or LiteLLM lists new models, and closes the issue when neither holds.
# Only the generated modules count as a rate change, because the vendored snapshot also changes when LiteLLM edits fields that set no price.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 1 * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh-pricing-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          prune-cache: true
      - name: Refresh pricing metadata
        run: uv run python -m scripts.update_pricing_metadata > "$RUNNER_TEMP/untracked-model-keys.txt"
      - name: Report needed pricing updates
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Update pricing metadata
        run: |
          git diff -- src/langchaint/openai/_generated_pricing.py src/langchaint/anthropic/_generated_pricing.py > "$RUNNER_TEMP/rate-changes.diff"
          # Each gh call runs without a pipe, so a gh failure fails the step instead of reading as "no issue" or "fingerprint changed".
          issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --limit 100 --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")
          if [ ! -s "$RUNNER_TEMP/rate-changes.diff" ] && [ ! -s "$RUNNER_TEMP/untracked-model-keys.txt" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The committed pricing metadata matches LiteLLM, and no OpenAI or Anthropic direct-API text model remains unpriced and unignored."
            fi
            exit 0
          fi
          # The fingerprint covers only the rate diff and the model list, so a template edit does not count as a change.
          fingerprint=$(cat "$RUNNER_TEMP/rate-changes.diff" "$RUNNER_TEMP/untracked-model-keys.txt" | sha256sum | cut -d' ' -f1)
          body="$RUNNER_TEMP/pricing-update-issue.md"
          cp .github/pricing-update-issue-body.md "$body"
          if [ -s "$RUNNER_TEMP/rate-changes.diff" ]; then
            printf '\n## Changed rates\n\n```diff\n' >> "$body"
            cat "$RUNNER_TEMP/rate-changes.diff" >> "$body"
            printf '```\n' >> "$body"
          fi
          if [ -s "$RUNNER_TEMP/untracked-model-keys.txt" ]; then
            printf '\n## New models\n\n' >> "$body"
            sed 's/.*/- `&`/' "$RUNNER_TEMP/untracked-model-keys.txt" >> "$body"
          fi
          printf '\n<!-- fingerprint: %s -->\n' "$fingerprint" >> "$body"
          if [ -z "$issue" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file "$body"
            exit 0
          fi
          current_body=$(gh issue view "$issue" --json body --jq .body)
          if [[ "$current_body" != *"<!-- fingerprint: $fingerprint -->"* ]]; then
            # Comment before editing, so a failed comment is retried on the next run.
            gh issue comment "$issue" --body "The listed rate changes or new models changed."
            gh issue edit "$issue" --body-file "$body"
          fi
